version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: sanab_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=sanab_production
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: sanab_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanab_backend
    ports:
      - "10001:10001"
    environment:
      - PORT=10001
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/sanab_production
      - JWT_SECRET=${JWT_SECRET:-sanab_prod_jwt_secret_change_me_in_env}
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-sanab_prod_refresh_secret_change_me_in_env}
      - JWT_REFRESH_EXPIRES_IN=7d
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sanab_frontend
    ports:
      - "10002:10002"
    environment:
      - PORT=10002
      - NEXT_PUBLIC_API_URL=http://localhost:10001/api/public
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  mongo_data:
  redis_data:
